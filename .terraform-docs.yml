# Shared terraform-docs config. Each module README carries a hand-written
# header followed by an injected, auto-generated reference block. CI runs
# this with --output-check to fail when a README drifts from the code.
formatter: "markdown table"

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

# The "Providers" section reports resolved provider versions read from
# .terraform/ — non-deterministic without an init. Requirements already
# carries the meaningful required_providers constraint.
sections:
  hide:
    - providers

settings:
  anchor: false
  hide-empty: true
